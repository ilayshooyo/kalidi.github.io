<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Mohamed Kalid Ali</title>
  <meta http-equiv="refresh" content="4;url=/" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Poppins", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 560px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      color: #475569;
      margin: 0 0 20px;
    }

    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #1f6feb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <script>
    const path = window.location.pathname;
    if (path !== "/") {
      setTimeout(() => {
        window.location.replace("/");
      }, 1200);
    }
  </script>
</head>
<body>
  <div class="card">
    <h1>404 — Not Found</h1>
    <p>
      This page does not exist or has moved. You’ll be redirected to the home page automatically.
    </p>
    <a href="/">Go to Home</a>
  </div>
</body>
</html>
